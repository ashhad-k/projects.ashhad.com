<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="../media/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Investor & Business Portal</title>
<meta name="description" content="Sign in to the Invest in Afghanistan investor and business portal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/portal.css">
</head>
<body>
<main class="auth">
 <div class="gmesh"></div>

 <div class="card">
  <a class="lg" href="../index.html"><img class="logoimg" src="../media/logo_grey.png" alt="Invest in Afghanistan" width="691" height="289"></a>
  <form class="af" data-af data-next="verify.html?flow=login">
   <div class="h">Sign in to your portal</div>
   <div class="sub">Investors and business owners, one account.</div>

   <div class="fld"><label>Email address</label>
    <div class="ip ic"><input type="email" placeholder="you@company.com" required>
     <svg class="lic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div></div>

   <div class="fld"><label>Password</label>
    <div class="ip ic"><input type="password" placeholder="Your password" data-pw required style="padding-right:62px">
     <svg class="lic" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
     <button type="button" class="toggle" data-toggle>Show</button></div></div>

   <div class="rowb"><label class="rem"><input type="checkbox">Keep me signed in</label><a href="forgot.html">Forgot password?</a></div>

   <button type="submit" class="pillbtn ink btn">Sign in &rarr;</button>

   <div class="otp-note"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M11 18h2"/></svg>For your security, we&rsquo;ll text a one-time code to your registered phone to confirm it&rsquo;s you.</div>

   <div class="alt">New to the portal? <a href="create-account.html">Create an account</a></div>
  </form>
 </div>

 <p class="foot-note">Ministry of Industry &amp; Commerce &middot; Investor &amp; Business Portal &middot; <a href="../index.html">Back to website</a></p>
</main>
<script src="assets/portal.js"></script>
</body>
</html>

<body>
<div class="ob">
 <div class="gmesh"></div>
 <div class="ob-top">
  <a class="lg lt" href="../index.html"><img class="logoimg" src="../media/logo_white.png" alt="Invest in Afghanistan" width="691" height="289"></a>
  <span class="save"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"/></svg>Progress saved automatically</span>
 </div>

  <div class="ob-hstep"><div class="s done"><span class="n"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"/></svg></span><span class="lb">Welcome</span></div><span class="cn ok"></span><div class="s done"><span class="n"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"/></svg></span><span class="lb" data-biz="Business details" data-inv="Investor profile">Business details</span></div><span class="cn ok"></span><div class="s done"><span class="n"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"/></svg></span><span class="lb">Documents</span></div><span class="cn ok"></span><div class="s on"><span class="n">4</span><span class="lb">Preferences</span></div></div>

 <div class="ob-cardwrap">
  <div class="ob-card">
   <span class="k">Step 4 of 4</span>
   <h1>What are you interested in?</h1>
   <p class="intro">Pick the sectors you want to hear about. We&rsquo;ll surface relevant opportunities, incentives and deadlines on your dashboard.</p>

   <form class="af" data-af data-carry data-next="onboarding-done.html">
    <div class="fld"><label>Sectors of interest</label>
     <div class="chips">
      <label><input type="checkbox" checked><span class="c">Agriculture &amp; agri-processing</span></label>
      <label><input type="checkbox"><span class="c">Manufacturing</span></label>
      <label><input type="checkbox" checked><span class="c">Energy &amp; solar</span></label>
      <label><input type="checkbox"><span class="c">Mining &amp; extractives</span></label>
      <label><input type="checkbox"><span class="c">Trade &amp; logistics</span></label>
      <label><input type="checkbox"><span class="c">Textiles</span></label>
      <label><input type="checkbox"><span class="c">Construction</span></label>
      <label><input type="checkbox"><span class="c">Services &amp; tech</span></label>
     </div>
    </div>

    <div class="fld" style="margin-top:22px"><label>Provinces you&rsquo;re considering</label>
     <div class="chips">
      <label><input type="checkbox" checked><span class="c">Kabul</span></label>
      <label><input type="checkbox"><span class="c">Herat</span></label>
      <label><input type="checkbox"><span class="c">Balkh</span></label>
      <label><input type="checkbox"><span class="c">Kandahar</span></label>
      <label><input type="checkbox"><span class="c">Nangarhar</span></label>
      <label><input type="checkbox"><span class="c">No preference yet</span></label>
     </div>
    </div>

    <div class="fld" style="margin-top:22px"><label>How should we keep you updated?</label>
     <div class="chips">
      <label><input type="checkbox" checked><span class="c">SMS on status changes</span></label>
      <label><input type="checkbox" checked><span class="c">Email summaries</span></label>
      <label><input type="checkbox"><span class="c">New opportunity alerts</span></label>
      <label><input type="checkbox"><span class="c">Deadline reminders</span></label>
     </div>
    </div>

    <div class="ob-actions">
     <a class="skip" href="onboarding-documents.html" data-carry>&larr; Back</a>
     <div class="grow"></div>
     <button type="submit" class="pillbtn ink">Finish setup &rarr;</button>
    </div>
   </form>
  </div>
 </div>
</div>
<script src="assets/portal.js"></script>
</body>
</html>

<!--
  Top utility row (desktop only): Help on the left; Contact + Fund (accent pill) on
  the right. Include via data-include; serve over HTTP (file:// will not load).
-->
<div class="stp-shell stp-utility-shell d-none d-md-block">
  <div class="container-fluid d-flex align-items-center justify-content-between flex-wrap gap-2 gap-md-3">
    <div class="stp-util-links">
      <a class="stp-util-fund" href="#">
        <svg class="stp-util-icon stp-util-icon--badge" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="currentColor" />
          <text x="12" y="16" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">$</text>
        </svg>
        Fund your Account
      </a>
    </div>
    <div class="stp-util-links">
      <a href="/stp-trading/contact/">
        <svg class="stp-util-icon stp-util-icon--badge" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="#333" />
          <text x="12" y="15.5" text-anchor="middle" fill="#fff" font-size="10" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">@</text>
        </svg>
        Contact Us
      </a>
      <a href="/stp-trading/faq/">
        <svg class="stp-util-icon stp-util-icon--badge" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="#333" />
          <text x="12" y="16.25" text-anchor="middle" fill="#fff" font-size="12" font-weight="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">?</text>
        </svg>
        Help
      </a>
    </div>
  </div>
</div>
